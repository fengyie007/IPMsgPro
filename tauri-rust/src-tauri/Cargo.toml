[package]
name = "speedipmsg-rust"
version = "0.1.0"
edition = "2021"
default-run = "SpeedIpMsgRust"

[lib]
name = "speedipmsg_rust_lib"

[[bin]]
name = "SpeedIpMsgRust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ipmsg-core = { path = "../crates/ipmsg-core" }
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
socket2 = { version = "0.6.5", features = ["all"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_Media_Multimedia", "Win32_System_Registry", "Win32_Security"] }
