[package]
name = "ipmsg-core"
version = "0.1.0"
edition = "2021"
description = "Tauri-independent IPMsg text protocol and FeiQ text compatibility"
publish = false

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
getrandom = "0.3"

[dev-dependencies]
socket2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
